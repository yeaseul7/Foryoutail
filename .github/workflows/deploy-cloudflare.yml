name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_ANIMALS_OPENAPI: ${{ secrets.NEXT_PUBLIC_ANIMALS_OPENAPI }}
      NEXT_PUBLIC_VWORLD_API_KEY: ${{ secrets.NEXT_PUBLIC_VWORLD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prepare Cloudflare runtime secrets
        run: |
          node <<'EOF'
          const fs = require('fs');
          const keys = [
            'NEXT_PUBLIC_BASE_URL',
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'NEXT_PUBLIC_ANIMALS_OPENAPI',
            'NEXT_PUBLIC_VWORLD_API_KEY',
          ];

          const missing = keys.filter((key) => !process.env[key]);
          if (missing.length > 0) {
            console.error(`Missing required deploy secrets: ${missing.join(', ')}`);
            process.exit(1);
          }

          const payload = Object.fromEntries(
            keys.map((key) => [key, process.env[key]])
          );

          fs.writeFileSync(
            '.cloudflare-secrets.json',
            JSON.stringify(payload, null, 2),
          );
          EOF

      - name: Build
        run: npm run build

      - name: Verify Supabase browser configuration
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const root = '.open-next/assets/_next/static/chunks';
          const files = fs.readdirSync(root).filter((file) => file.endsWith('.js'));
          const expectedUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const hasUrl = files.some((file) =>
            fs.readFileSync(path.join(root, file), 'utf8').includes(expectedUrl)
          );

          if (!hasUrl) {
            console.error('Supabase URL was not embedded in the browser bundle.');
            process.exit(1);
          }
          EOF

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Upload Preview version
        id: preview
        shell: bash
        run: |
          set -o pipefail
          preview_alias="ci-${GITHUB_REF_NAME}"
          output=$(npx wrangler versions upload \
            --preview-alias "$preview_alias" \
            --secrets-file .cloudflare-secrets.json \
            --message "GitHub Actions preview ${GITHUB_SHA}")
          echo "$output"

          version_id=$(echo "$output" | sed -n 's/.*Worker Version ID: \([a-f0-9-]*\).*/\1/p' | tail -1)
          if [ -z "$version_id" ]; then
            echo "Could not determine uploaded Worker Version ID."
            exit 1
          fi

          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=https://${preview_alias}-foryoutail.cutie32769.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Run Preview E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: npm run test:e2e

      - name: Promote verified version to Production
        if: github.ref == 'refs/heads/main'
        run: npx wrangler versions deploy "${{ steps.preview.outputs.version_id }}@100%" --yes

      - name: Verify Production
        if: github.ref == 'refs/heads/main'
        env:
          PLAYWRIGHT_BASE_URL: https://www.kkosunnae.com
        run: npm run test:e2e

      - name: Upload E2E failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .cloudflare-secrets.json
