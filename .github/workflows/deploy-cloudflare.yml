name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_ANIMALS_OPENAPI: ${{ secrets.NEXT_PUBLIC_ANIMALS_OPENAPI }}
      NEXT_PUBLIC_VWORLD_API_KEY: ${{ secrets.NEXT_PUBLIC_VWORLD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Cloudflare runtime secrets
        run: |
          node <<'EOF'
          const fs = require('fs');
          const keys = [
            'NEXT_PUBLIC_BASE_URL',
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'NEXT_PUBLIC_ANIMALS_OPENAPI',
            'NEXT_PUBLIC_VWORLD_API_KEY',
          ];

          const missing = keys.filter((key) => !process.env[key]);
          if (missing.length > 0) {
            console.error(`Missing required deploy secrets: ${missing.join(', ')}`);
            process.exit(1);
          }

          const payload = Object.fromEntries(
            keys.map((key) => [key, process.env[key]])
          );

          fs.writeFileSync(
            '.cloudflare-secrets.json',
            JSON.stringify(payload, null, 2),
          );
          EOF
          npx wrangler secret bulk .cloudflare-secrets.json
          rm .cloudflare-secrets.json

      - name: Lint
        run: npm run lint

      - name: Deploy
        run: npm run deploy
